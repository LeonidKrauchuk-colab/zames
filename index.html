<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAMES</title>
  <!-- <link rel="icon" href="favicon/"> -->
  <link rel="icon" href="favicon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="header">
    <p class="p_header">ZAMES</p>
  </div>

  <div class="radio_wrap body_wrap_element">
    <fieldset>
      <legend>Режим езды:</legend>

      <div>
        <input type="radio" id="huey" name="ezda" value="huey" checked />
        <label for="huey">Обычная</label>
      </div>

      <div>
        <input type="radio" id="dewey" name="ezda" value="dewey" />
        <label for="dewey">Обкатка</label>
      </div>


    </fieldset>
    <fieldset>
      <legend>Тип масла:</legend>

      <div>
        <input type="radio" id="huey1" name="variantOil" value="40" checked />
        <label for="huey1">Обычное</label>
      </div>

      <div>
        <input type="radio" id="dewey1" name="variantOil" value="50" />
        <label for="dewey1">1:50</label>
      </div>
    </fieldset>
  </div>

  <div class="conteiner_gsm">
    <div class="conteiner benz body_wrap_element">
      <p class="gsm_p">Бензин<span class="gsm_span">(л.)</span></p>
      <div class="img_wrap">
        <img src="images/free-icon-jerrycan-1505586.png" alt="" width="90">
      </div>
      <p class="outBenz gsm_p_val">5</p>
    </div>
    <div class="conteiner oil body_wrap_element">
      <p class="gsm_p">Масло<span class="gsm_span">(г.)</span></p>
      <div class="img_wrap">
        <img src="images/free-icon-oil-3907189.png" alt="" width="60">
      </div>
      <p class="outOil gsm_p_val"></p>
    </div>
  </div>
  <div class="range body_wrap_element">
    <input type="range" id="benzin" name="benzin" min="0" max="18" value="5" step="0.1" />
    <label for="benzin"></label>
  </div>
  <div class="body_wrap_element body_info">
    <h3 class="h3_info">Запас хода:</h3>
    <p class="info">
      на <span class="out_span out_km"></span> л. бензина, с коляской, Егор проедет -- <span
        class="out_span coliasca_km"></span> км.
      <br>
      -- без коляски, Егор проедет -- <span class="out_span no_coliasca_km"></span> км.
    </p>
    <p class="fun">План поездки: ехать. Остальное разберём по дороге.</p>

  </div>

  <script src="script.js" defer></script>
</body>

</html>
